# Uncertain drivers that root metrics read (here: load_factor). With --llm the
# decomposer agent can propose these instead.
decompositions:
  - parent: read_p99_ms
    rationale: Database reads slow down under peak load.
    children:
      - id: load_factor
        parent_ids: []
        kind: sub
        distribution: { type: lognormal, params: { median: 1.3, sigma: 0.25 } }
        observable: true
        measure_cost: 400
        measurement: { likelihood: lognormal, noise: 0.1, replicates: 2 }
        source: expert
        rationale: Peak-hour slowdown multiplier on database reads.
